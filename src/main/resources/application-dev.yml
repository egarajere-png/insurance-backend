spring:
  jpa:
    hibernate:
      # "update" only adds missing tables/columns. Widening/relaxing existing
      # columns (e.g. customer.gender) is handled by DbSchemaFixer at startup.
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  datasource:
    username: insurance_user
    password: password
    url: jdbc:postgresql://localhost:5432/insurance?createDatabaseIfNotExist=true
