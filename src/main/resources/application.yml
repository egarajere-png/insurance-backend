server:
  port: 8092

spring:
  docker:
    compose:
      enabled: false

  profiles:
    active: dev

  mvc:
    pathmatch:
      matching-strategy: ANT_PATH_MATCHER

logging:
  file:
    # Relative path so it works on Windows and Linux alike (was /logs/... which fails on Windows)
    name: logs/abcib-api.log
  logback:
    rollingpolicy:
      max-history: 100
